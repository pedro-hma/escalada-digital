name: Run 6 avatar rework

on:
  push:
    paths:
      - '.github/workflows/run6-avatar-rework.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply avatar rework
        run: python scripts/apply_run6.py
      - name: Fix Three r179 typings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace("    materials.forEach((m) => { m.skinning = true; });\n", "")
          s=s.replace("  useEffect(() => () => mixer.stopAllAction(), [mixer]);", "  useEffect(() => () => { mixer.stopAllAction(); }, [mixer]);")
          p.write_text(s)
          PY
      - name: Validate production build
        run: |
          npm install
          npm run build
      - name: Commit Run 6
        run: |
          git config user.name "escalada-digital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx package-lock.json
          git commit -m "feat: Run 6 rigged human avatar rework"
          git push origin main
