name: Run 5 human avatar

on:
  push:
    paths:
      - '.github/workflows/run5-human-avatar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Run 5 patch
        run: python scripts/run5_patch.py
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit Run 5
        run: |
          git config user.name "escalada-digital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "feat: Run 5 humanized avatar and orbit preview"
          git push origin main
