name: Fix avatar preview framing

on:
  push:
    paths:
      - '.github/workflows/fix-avatar-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ajustar camera e enquadramento do avatar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = 'function Preview3D({ avatar }: { avatar: Avatar }) {\n  return <div className="preview3d"><Canvas camera={{ position:[0,.55,3.7], fov:36 }} shadows><ambientLight intensity={1.2}/><directionalLight position={[3,5,4]} intensity={2} castShadow/><pointLight position={[-3,2,2]} color="#22d3ee" intensity={5}/><group position={[0,-.45,0]}><Character3D avatar={avatar} scale={.9}/></group><mesh rotation={[-Math.PI/2,0,0]} position={[0,-1.42,0]} receiveShadow><circleGeometry args={[1.2,48]}/><meshStandardMaterial color="#0a1711"/></mesh></Canvas></div>;\n}'
          new = 'function Preview3D({ avatar }: { avatar: Avatar }) {\n  return <div className="preview3d"><Canvas camera={{ position:[0,1.15,4.4], fov:38 }} shadows><ambientLight intensity={1.2}/><directionalLight position={[3,5,4]} intensity={2} castShadow/><pointLight position={[-3,2,2]} color="#22d3ee" intensity={5}/><group position={[0,-.78,0]}><Character3D avatar={avatar} scale={.86}/></group><mesh rotation={[-Math.PI/2,0,0]} position={[0,-1.56,0]} receiveShadow><circleGeometry args={[1.2,48]}/><meshStandardMaterial color="#0a1711"/></mesh></Canvas></div>;\n}'
          if old not in s:
              raise SystemExit('Preview3D target not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "escalada-digital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: frame full avatar in 3D preview"
          git push origin main
