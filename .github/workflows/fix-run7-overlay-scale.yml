name: Fix Run 7 overlay scale

on:
  push:
    paths:
      - '.github/workflows/fix-run7-overlay-scale.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply scale repair
        run: python scripts/fix_run7_scale.py
      - name: Validate production build
        run: |
          npm install
          npm run build
      - name: Commit repair
        run: |
          git config user.name "escalada-digital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx package-lock.json
          git commit -m "fix: Run 7 avatar overlay scaling"
          git push origin main
